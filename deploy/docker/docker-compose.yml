services:
  fleet-telemetry:
    image: tesla/fleet-telemetry:latest
    container_name: fleetmate-telemetry
    restart: unless-stopped
    ports:
      - "4443:4443"
      - "8095:8095"
    volumes:
      - ./config/fleet-telemetry:/etc/fleet-telemetry:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fleetmate-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto:/mosquitto/config

  fleetmate-bridge:
    image: ghcr.io/rodolfoconcepcion/fleetmate:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetmate-bridge
    restart: unless-stopped
    environment:
      - FLEETMATE_MQTT_BROKER=mosquitto
      - FLEETMATE_MQTT_PORT=1883
      - FLEETMATE_POSTGRES_HOST=database
      - FLEETMATE_POSTGRES_PORT=5432
      - FLEETMATE_POSTGRES_USER=teslamate
      - FLEETMATE_POSTGRES_PASSWORD=teslamate_pwd_2026
      - FLEETMATE_POSTGRES_DB=teslamate
      - FLEETMATE_CAR_ID=1
    ports:
      - "9090:9090"
    depends_on:
      - fleet-telemetry
      - database

  database:
    image: postgres:16-alpine
    container_name: fleetmate-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=teslamate_pwd_2026
      - POSTGRES_DB=teslamate
    volumes:
      - teslamate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate -d teslamate"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: teslamate/grafana:latest
    container_name: fleetmate-grafana
    restart: unless-stopped
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=teslamate_pwd_2026
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
    ports:
      - "3100:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      - database

volumes:
  teslamate-db:
  teslamate-grafana-data:
