name: Multilingual Documentation Translation

on:
  push:
    branches: [ main ]
    paths:
      - '*.md'
      - 'docs/**/*.md'
      - '!*.es.md'
      - '!docs/**/*.es.md'
  pull_request:
    branches: [ main ]
    paths:
      - '*.md'
      - 'docs/**/*.md'
      - '!*.es.md'
      - '!docs/**/*.es.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: Translate Documentation (i18n)
    # Prevent bot from triggering itself recursively
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Translate Markdown Files
        uses: ikhsan3adi/markdown-translator@v3
        with:
          LANG: |-
            es
          FILES: |-
            *.md
            docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
