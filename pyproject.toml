[project]
name = "fleetmate"
version = "0.5.0"
description = "High-speed, zero-cost Tesla Fleet Telemetry mTLS streaming engine & bridge for TeslaMate and Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rodolfo Concepcion" }
]
keywords = ["tesla", "teslamate", "fleet-telemetry", "mqtt", "home-assistant", "mtls", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "aiomqtt>=2.2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
fleetmate = "fleetmate.cli:main"

[project.urls]
Homepage = "https://github.com/rodolfoconcepcion/fleetmate"
Documentation = "https://github.com/rodolfoconcepcion/fleetmate#readme"
Repository = "https://github.com/rodolfoconcepcion/fleetmate.git"
Issues = "https://github.com/rodolfoconcepcion/fleetmate/issues"
Changelog = "https://github.com/rodolfoconcepcion/fleetmate/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
